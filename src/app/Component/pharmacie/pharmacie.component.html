<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Système de Gestion d'Ordonnances</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f9f9f9; font-family: Arial, sans-serif; }
    .top-nav { background-color: #0d6efd; padding: 0.8rem; color: #fff; }
    .top-nav a { color: #fff; text-decoration: none; }
    .nav-links li { list-style: none; margin: 0 10px; }
    .nav-links a { color: #fff; font-weight: 500; }
    .user-info { margin-right: 10px; font-weight: 500; }
    .page-header { margin: 2rem 0; text-align: center; }
    .btn-search { background-color: #0d6efd; color: white; }
    .prescription-wrapper { background: #fff; padding: 20px; border-radius: 12px; margin-top: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .info-card { background: #f1f5f9; border-radius: 8px; padding: 15px; }
    .info-label { font-weight: 600; color: #333; }
    .info-value { color: #555; }
    .section-title { margin-top: 20px; margin-bottom: 10px; font-weight: bold; }
    .medication-list { padding-left: 20px; }
    .medication-item { margin-bottom: 5px; }
    .prescription-footer { margin-top: 20px; text-align: center; font-size: 14px; color: green; }
    .alert-modern { margin-top: 20px; }
  </style>
</head>
<body>
  <!-- Navigation Header -->
  <nav class="top-nav">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center">
        <a href="#" class="nav-brand">
          <i class="bi bi-hospital me-2"></i> MedSystem
        </a>
        <ul class="nav-links d-none d-md-flex">
          <li>
            <a routerLink="/front">
              <i class="bi bi-table"></i> <span>Table Patient</span>
            </a>
          </li>
          <li>
            <a routerLink="/pharmacy" class="active">
              <i class="bi bi-capsule"></i> <span>Pharmacie</span>
            </a>
          </li>
        </ul>
        <div class="user-section">
          <div class="user-info">
            <i class="bi bi-person-circle"></i>
            <span>{{ getUsername() }}</span>
          </div>
          <button class="btn btn-outline-danger btn-sm" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i> Déconnexion
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Wrapper -->
  <div class="main-wrapper">
    <div class="animate__animated animate__fadeInUp">
      
      <!-- Page Header -->
      <header class="page-header">
        <h1 class="page-title">
          <i class="bi bi-hospital"></i> Vérification d'Ordonnance
        </h1>
        <p class="subtitle">Système de contrôle pharmaceutique intelligent et sécurisé</p>
      </header>

      <!-- Search Section -->
      <section class="search-container">
        <div class="search-header">
          <i class="bi bi-search fs-4 text-primary"></i>
          <h4>Recherche de Patient</h4>
        </div>
        <div class="row g-4">
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" [(ngModel)]="nom" id="nom" placeholder="Nom du patient">
              <label for="nom"><i class="bi bi-person me-2"></i>Nom du patient</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" [(ngModel)]="prenom" id="prenom" placeholder="Prénom du patient">
              <label for="prenom"><i class="bi bi-person me-2"></i>Prénom du patient</label>
            </div>
          </div>
          <div class="col-12">
            <button class="btn btn-search w-100" (click)="verifierOrdonnance()">
              <i class="bi bi-search me-2"></i> Vérifier Ordonnance
            </button>
          </div>
        </div>
      </section>

      <!-- Résultat Vérification -->
      <div *ngIf="resultat" class="alert alert-modern fade-in"
           [ngClass]="{
             'alert-success': resultat.startsWith('✅'),
             'alert-danger': resultat.startsWith('❌'),
             'alert-warning': resultat.startsWith('⚠️')
           }">
        <i *ngIf="resultat.startsWith('✅')" class="bi bi-check-circle-fill text-success me-2"></i>
        <i *ngIf="resultat.startsWith('❌')" class="bi bi-x-circle-fill text-danger me-2"></i>
        <i *ngIf="resultat.startsWith('⚠️')" class="bi bi-exclamation-triangle-fill text-warning me-2"></i>
        {{ resultat }}
      </div>

      <!-- Médicaments incompatibles -->
      <section *ngIf="incompatibles.length > 0" class="prescription-wrapper">
        <h5 class="section-title text-danger">
          <i class="bi bi-exclamation-triangle"></i> Interactions Médicamenteuses
        </h5>
        <ul class="medication-list">
          <li *ngFor="let pair of incompatibles" class="medication-item text-danger">
            <i class="bi bi-capsule me-2"></i> <strong>{{ pair[0] }}</strong> + <strong>{{ pair[1] }}</strong>
          </li>
        </ul>
      </section>

      <!-- Médicaments indisponibles -->
      <section *ngIf="indisponibles.length > 0" class="prescription-wrapper">
        <h5 class="section-title text-secondary">
          <i class="bi bi-x-circle"></i> Médicaments Indisponibles
        </h5>
        <ul class="medication-list">
          <li *ngFor="let med of indisponibles" class="medication-item text-muted">
            <i class="bi bi-capsule me-2"></i> {{ med }}
          </li>
        </ul>
      </section>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
